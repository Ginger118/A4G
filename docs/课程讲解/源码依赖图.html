  return left.length-right.length;
}
function drawDeps() {
  const {incoming,outgoing}=relation();
  const columns=[incoming,outgoing].map(map=>[...map.entries()].sort(([a],[b])=>orderTargets(a,b)));
  const width=1240, height=Math.max(310,...columns.map(a=>a.length*280+75)), center=height/2-70;
  const nodes=[card(info(selectedFn||selected.path),490,center,{center:true})], edges=[];
  for(const [column,entries] of columns.entries()) entries.forEach(([key,labels],i)=>{
    const x=column?950:24,y=56+i*280;
    nodes.push(card(info(key),x,y));
    edges.push(column?{x1:748,y1:center+33,x2:x-7,y2:y+33,label:labels[0]}:{x1:282,y1:y+33,x2:483,y2:center+33,label:labels[0]});
  });
  for(const [i,title] of ['调用方 / 导入方','当前文件 / 函数','被调用方 / 依赖'].entries()) nodes.push(`<h3 class="flow-title" style="left:${[24,490,950][i]}px;top:18px">${title}</h3>`);
  $('edge-details').innerHTML=columns.flat().map(([key,labels])=>`<details><summary>${esc(info(key).definition?.name||pathLabel(info(key).file.path))}</summary><ul>${labels.map(l=>`<li>${esc(l)}</li>`).join('')}</ul></details>`).join('')||'<p>该节点没有静态解析出的项目内依赖。</p>';
  $('graph-note').textContent='同列文件按编辑器的目录优先顺序排列。完整函数名可在下方调用与依赖边查看。';
  return {width,height,nodes,edges};
}
function transform() {
  world.style.transform=`translate(${camera.x}px, ${camera.y}px) scale(${camera.scale})`;
  $('zoom-level').textContent=Math.round(camera.scale*100)+'%';
}
function fit(minimum=.12) {
  const width=viewport.clientWidth,height=viewport.clientHeight;
  if (!width || !height) return;
  const scale=Math.max(minimum,Math.min(1,(width-28)/scene.width,(height-28)/scene.height));
  camera={scale,x:Math.max(14,(width-scene.width*scale)/2),y:Math.max(14,(height-scene.height*scale)/2)};
  transform();
}
function zoom(factor,x=viewport.clientWidth/2,y=viewport.clientHeight/2) {
  const scale=Math.max(.12,Math.min(3,camera.scale*factor)), ratio=scale/camera.scale;
  camera={scale,x:x-(x-camera.x)*ratio,y:y-(y-camera.y)*ratio};
  transform();
}
function render({fitView=false}={}) {
  scene=view==='flow'?drawFlow():drawDeps();
  world.style.width=scene.width+'px';
  world.style.height=scene.height+'px';
  world.innerHTML=svg(scene.edges,scene.width,scene.height)+scene.nodes.join('');
  if(fitView)fit(.65);else transform();
}
function setView(next, fitView=true) {
  view=next;
  for(const button of document.querySelectorAll('[data-view]')) button.setAttribute('aria-pressed',String(button.dataset.view===view));
  $('flow-choice').hidden=view!=='flow';
  render({fitView});
}
function pick(file,fn=null,graph=true) {
  selected=file;
  selectedFn=fn;
  for(let p=file.path.slice(0,file.path.lastIndexOf('/'));p!=='src';p=p.slice(0,p.lastIndexOf('/'))) expanded.set(p,true);
  list();details();
  $('selection-label').textContent=fn?defs.get(fn).name:pathLabel(file.path);
  $('source-panel').open=true;
  if(graph) setView('deps');
}
$('functions').addEventListener('change',e=>pick(selected,e.target.value||null));
document.addEventListener('click',event=>{
  const button=event.target.closest('[data-view],[data-target],[data-file]');
  if(!button)return;
  if(button.dataset.view) setView(button.dataset.view);
  else if(button.dataset.target) {
    const n=defs.get(button.dataset.target);pick(n.file,n.id);
  } else pick(fileByPath.get(button.dataset.file));
});
$('flow-choice').innerHTML='<option value="all">全部核心链路</option>'+data.flows.map(f=>`<option value="${esc(f.title)}">${esc(f.title)}</option>`).join('')+'<option value="services">运行与编排入口</option>';
$('flow-choice').value=data.flows[0].title;
$('flow-choice').addEventListener('change',()=>render({fitView:true}));
$('sidebar-toggle').addEventListener('click',()=>{
  const closed=!$('sidebar').hidden;
  $('sidebar').hidden=closed;
  $('layout').classList.toggle('closed',closed);
  $('sidebar-toggle').textContent=closed?'展开文件栏':'收起文件栏';
  $('sidebar-toggle').setAttribute('aria-expanded',String(!closed));
});
viewport.addEventListener('pointerdown',event=>{
  if(event.button!==0||event.target.closest('button,a'))return;
  drag={id:event.pointerId,x:event.clientX,y:event.clientY,startX:camera.x,startY:camera.y};
  viewport.setPointerCapture(event.pointerId);
  viewport.classList.add('dragging');
});
viewport.addEventListener('pointermove',event=>{
  if(drag?.id!==event.pointerId)return;
  camera.x=drag.startX+event.clientX-drag.x;camera.y=drag.startY+event.clientY-drag.y;transform();
});
for (const type of ['pointerup','pointercancel','lostpointercapture']) viewport.addEventListener(type, event=>{
  if(drag?.id!==event.pointerId)return;
  drag=null;viewport.classList.remove('dragging');
});
viewport.addEventListener('wheel',event=>{
  event.preventDefault();const r=viewport.getBoundingClientRect();
  zoom(Math.exp(-event.deltaY*.0015),event.clientX-r.left,event.clientY-r.top);
},{passive:false});
viewport.addEventListener('keydown',event=>{
  const delta={ArrowLeft:[45,0],ArrowRight:[-45,0],ArrowUp:[0,45],ArrowDown:[0,-45]}[event.key];
  if(delta&&event.target===viewport){event.preventDefault();camera.x+=delta[0];camera.y+=delta[1];transform();}
});
$('zoom-in').addEventListener('click',()=>zoom(1.25));
$('zoom-out').addEventListener('click',()=>zoom(.8));
$('reset').addEventListener('click',()=>fit());
const graphPanel=$('graph-panel');
function syncFullscreen() {
  const active=document.fullscreenElement===graphPanel||graphPanel.classList.contains('full-fallback');
  $('fullscreen').textContent=active?'退出全屏':'全屏';
  $('fullscreen').setAttribute('aria-pressed',String(active));
  requestAnimationFrame(()=>fit());
}
function fallback(active) {
  graphPanel.classList.toggle('full-fallback',active);
  document.body.classList.toggle('full-lock',active);
  syncFullscreen();
}
$('fullscreen').addEventListener('click',async()=>{
  if(graphPanel.classList.contains('full-fallback')){fallback(false);return;}
  if(document.fullscreenElement===graphPanel){await document.exitFullscreen();return;}
  try {await graphPanel.requestFullscreen();}
  catch {fallback(true);}
});
document.addEventListener('fullscreenchange',syncFullscreen);
document.addEventListener('keydown',event=>{
  if(event.key==='Escape'&&graphPanel.classList.contains('full-fallback'))fallback(false);
});
list();details();setView('flow');
</script></body></html>
