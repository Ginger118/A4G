<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470"><rect width="1100" height="470" fill="#f6f8fb"/><g font-family="PingFang SC,Arial" fill="#213a56"><text x="35" y="45" font-size="27">序流 v0.6 · 三项低前置条件优化</text><rect x="35" y="90" width="1030" height="108" rx="12" fill="white" stroke="#c9d5e3"/><text x="53" y="119" font-size="19">普通流式聊天</text><text x="53" y="147" font-size="16">SQLite历史 → memory.select_context → trim_messages → ChatDeepSeek.astream</text><text x="53" y="174" font-size="14">streaming.chat_events：完整问答对，估算预算；不删除原消息</text><rect x="35" y="210" width="1030" height="108" rx="12" fill="white" stroke="#c9d5e3"/><text x="53" y="239" font-size="19">资料意图理解</text><text x="53" y="267" font-size="16">ChatPromptTemplate → RunnableLambda → PydanticOutputParser → Intent</text><text x="53" y="294" font-size="14">intent_chain.classify_intent：格式最多两次；原LangGraph与只读契约继续校验</text><rect x="35" y="330" width="1030" height="108" rx="12" fill="white" stroke="#c9d5e3"/><text x="53" y="359" font-size="19">新Markdown导入</text><text x="53" y="387" font-size="16">ATX原文分节 → MarkdownHeaderTextSplitter元数据 → 递归切分 → Milvus</text><text x="53" y="414" font-size="14">markdown_chunks.split_markdown → rag.add_document：标题/原文offset随来源返回</text></g></svg>